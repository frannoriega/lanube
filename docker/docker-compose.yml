# app_node_modules volume: entrypoint runs `npm ci` when package-lock.json changes (see
# docker/app-entrypoint.sh) or .bin/next is missing. Optional: docker compose ... run --rm app npm ci
services:
  postgres:
    build:
      context: ..
      dockerfile: docker/Dockerfile.postgres
    container_name: lanube-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: lanube
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases:
          - lanube-postgres

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    container_name: lanube-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../:/app
      - app_node_modules:/app/node_modules
    ports:
      - "3000:3000"
      - "9229:9229"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://postgres:lanube@postgres:5432/postgres?schema=public
      NODE_ENV: development
      NODE_OPTIONS: --inspect=0.0.0.0:9229
      # Reach Mailpit from the app container (localhost in .env is only valid on the host)
      SMTP_SERVER_HOST: mailpit
      WATCHPACK_POLLING: "true"
      ENABLE_MX_GOOGLE_HOSTED_DETECTION: "true"
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0"]
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  migrate:
    image: node:24-bookworm
    container_name: lanube-migrate
    restart: "no"
    working_dir: /app
    volumes:
      - ../:/app
      - migrate_node_modules:/app/node_modules
    command: sh /app/docker/migrate-entry.sh
    environment:
      DATABASE_URL: postgresql://postgres:lanube@postgres:5432/postgres?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    container_name: lanube-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI → http://localhost:8025

volumes:
  postgres_data:
  migrate_node_modules:
  app_node_modules:
